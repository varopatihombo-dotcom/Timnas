<body>
<main>
<h1>Pelatih Timnas</h1>
<p class="sub">Jalani Piala AFF, Kualifikasi Piala Dunia, Piala Dunia, dan Piala Asia. Selama kontrak berlaku, permainan terus berlanjut dan bisa diperpanjang. Jaga kepuasan PSSI supaya tidak dipecat. Nama pemain dan tim nyata, statistik hanya rekaan untuk game.</p>

</main>

<script>
const NAMES=[["Maarten Paes","KIP"],["Sandy Walsh","BEK"],["Jay Idzes","BEK"],["Justin Hubner","BEK"],["Calvin Verdonk","BEK"],["Thom Haye","GEL"],["Nathan Tjoe-A-On","GEL"],["Marselino Ferdinan","GEL"],["Ragnar Oratmangoen","SAY"],["Ole Romeny","PEN"],["Rafael Struick","PEN"]];
const TIM=["Filipina","Bahrain","China","Irak","Arab Saudi","Australia","Korea Selatan","Jepang","Iran","Qatar"];
const LAWAN=Array.from({length:20},(_,i)=>[TIM[i%10]+(i>=10?" (balik)":""),Math.round(46+i*2.2),["bal","atk","def"][i%3]]);
const TARGET=36;
const FORM={"4-3-3":{a:1.1,d:.95},"4-4-2":{a:1,d:1},"5-3-2":{a:.9,d:1.15},"3-5-2":{a:1.05,d:1}};
const NAT=[{n:"Joey Pelupessy",p:"GEL",c:40,s:[60,62,62,60]},{n:"Jordi Amat",p:"BEK",c:40,s:[60,56,64,64]},{n:"Mauro Zijlstra",p:"SAY",c:40,s:[62,60,54,56]},{n:"Eliano Reijnders",p:"GEL",c:45,s:[62,66,60,58]},{n:"Jens Raven",p:"PEN",c:45,s:[64,62,56,58]},{n:"Kevin Diks",p:"BEK",c:50,s:[64,60,62,62]},{n:"Mees Hilgers",p:"BEK",c:55,s:[66,62,66,64]},{n:"Emil Audero",p:"KIP",c:60,s:[66,68,64,66]}];
const PROG={
 fisik:{n:"Fisik",d:"Naik stamina, lelah +14",s:"fisik",f:14},
 teknik:{n:"Teknik",d:"Umpan dan tembakan, lelah +8",s:"teknik",f:8},
 taktik:{n:"Taktik",d:"Posisi dan kerja sama, lelah +8",s:"taktik",f:8},
 mental:{n:"Mental",d:"Fokus dan ketenangan, lelah +5",s:"mental",f:5},
 pulih:{n:"Pemulihan",d:"Stamina +30, ritme terjaga",s:null,f:-30},skip:{n:"Lewati hari",d:"Stamina +14 sendiri, ritme -12",s:null,f:0}
};
const TAK={atk:{n:"Menyerang",a:1.25,d:.85,x:"Lebih banyak gol, tapi rawan kebobolan."},bal:{n:"Seimbang",a:1,d:1,x:"Stabil melawan siapa pun."},def:{n:"Bertahan",a:.8,d:1.25,x:"Rapatkan barisan, cocok melawan tim kuat."},cnt:{n:"Serangan Balik",a:1,d:1.1,x:"Serangan melonjak jika lawan lebih kuat."},prs:{n:"Tekanan Tinggi",a:1.15,d:.95,x:"Menekan sejak awal, tapi pemain lebih cepat lelah."}};
let G;
const r=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));

function baru(){
 G={pekan:0,sesi:4,poin:0,w:0,d:0,l:0,gf:0,ga:0,tak:"bal",form:"4-3-3",fam:{},dana:40,nat:[],ritme:70,skip:0,hist:[],fifa:1250,rk:[],tr:{},past:[],fin:false,lt:'',feed:[],kon:4,cand:[],mg:null,pc:null,med:50,pra:0,pu:60,sk:0,cn:{},q:0,offer:0,tempo:"nor",garis:"tgh",sisi:"seim",pl:NAMES.map(([n,p])=>({n,p,fisik:r(42,52),teknik:r(42,52),taktik:r(40,50),mental:r(42,52),lelah:r(0,10)})),info:"Ada 4 hari latihan sebelum laga. Hari yang tidak dipakai dihitung libur.",main:false,log:[],skor:[0,0],menit:0,ball:50,selesai:false};G.rk=[rank()];mkT(0);
 draw();
}
function rating(){
 const t=G.pl.reduce((s,p)=>s+(p.fisik*.25+p.teknik*.3+p.taktik*.25+p.mental*.2)*(1-p.lelah/180),0);
 return t/G.pl.length*(.85+.15*G.ritme/100);
}
function latih(k){
 if(G.main)return;
 if(k=="skip")return skipDay();const pr=PROG[k];G.sesi++;G.skip=0;G.ritme=Math.min(100,G.ritme+(pr.s?10:2));G.pl.forEach(p=>{p.g=0;if(pr.s)p.lelah=cl(p.lelah-3,0,100)});if(k=="taktik")G.fam[G.tak]=(G.fam[G.tak]||0)+1;
 if(pr.s){
  G.pl.forEach(p=>{if(100-p.lelah<pr.f+8){p.g=0;return}const gain=p[pr.s]>88?r(0,1):p[pr.s]>75?r(1,2):r(2,5);p.g=gain;p.gs=pr.s;p[pr.s]=Math.min(99,p[pr.s]+gain);p.lelah=cl(p.lelah+pr.f+r(-2,3),0,100)});
  G.info="Latihan "+pr.n+" selesai. Rating tim "+rating().toFixed(1)+".";
 }else{
  G.pl.forEach(p=>p.lelah=cl(p.lelah+pr.f,0,100));
  G.info="Pemulihan selesai. Pemain lebih segar.";
 }
 const capek=G.pl.filter(p=>p.lelah>65).length;
 if(capek>3)G.info+=" Awas, "+capek+" pemain kelelahan.";
 draw();

function draw(){
 const A=document.getElementById("app");
 if(!G.mg){A.innerHTML=daftar();return}
 if(G.offer&&!G.selesai){A.innerHTML=ofer();return}
 if(G.selesai){
  const lolos=G.poin>=TARGET;
  A.innerHTML=`<div class="panel end"><h2>${G.selesai=='fired'?'Kamu dipecat PSSI':'Kontrak tidak diperpanjang'}</h2>
  <p>${G.poin} poin dari ${G.hist.length} laga. Rank FIFA akhir #${rank()}, ${Object.values(G.tr).filter(v=>v=='gold').length} trofi. Menang ${G.w}, seri ${G.d}, kalah ${G.l}. Gol ${G.gf}-${G.ga}.</p>
  <p class="msg">Coba taktik dan rotasi latihan berbeda untuk mengisi kabinet trofi.</p>${kabinet()}<p></p>
  <button class="go" onclick="baru()">Main lagi</button></div>`;return;
 }
 const lw=cur();
 const pbtn=Object.entries(PROG).map(([k,p])=>`<button onclick="latih('${k}')" ${G.main||(p.s&&!G.pl.some(q=>100-q.lelah>=p.f+8))?'disabled':''}>${p.n}<small>${p.d}</small></button>`).join("");
 const tbtn=Object.entries(TAK).map(([k,t])=>`<button class="${G.tak==k?"on":""}" onclick="setTak('${k}')" ${G.main?"disabled":""}>${t.n}<small>Familiar ${G.fam[k]||0}</small></button>`).join("");
 const fbtn=Object.entries(FORM).map(([k,f])=>`<button class="${G.form==k?"on":""}" onclick="setForm('${k}')" ${G.main?"disabled":""}>${k}</button>`).join("");
 const nbtn=NAT.filter(c=>!G.nat.includes(c.n)).slice(0,4).map(c=>`<button onclick="natur(${NAT.indexOf(c)})" ${G.main||G.dana<c.c?"disabled":""}>${c.n}<small>${c.p} · biaya ${c.c} dana</small></button>`).join("")||"<p class=\"msg\">Semua kandidat sudah dinaturalisasi.</p>";
 const seg=Object.entries(OPT).map(([ok,o])=>`<div class="seg"><span>${o.lbl}</span>${Object.entries(o.v).map(([vk,v])=>`<button class="${G[ok]==vk?"on":""}" onclick="setOpt('${ok}','${vk}')" ${G.main?"disabled":""}>${v.n}</button>`).join("")}</div>`).join("");
 const rows=G.pl.map(p=>`<div class="pl"><div class="n">${p.n}<i class="pp ${p.p}">${p.p}${p.nat?" · naturalisasi":""}</i></div>
  ${cell(p,"fisik")}${cell(p,"teknik")}${cell(p,"taktik")}${cell(p,"mental")}<span>${100-p.lelah}${bar(100-p.lelah,p.lelah>65?"low":p.lelah>35?"fat":"")}</span></div>`).join("");
 const pitch=(G.main||G.log.length&&G.menit)?`<div id="pitch"><div class="min" id="pmin">Menit ${G.menit}</div><div class="score" id="psc">${G.skor[0]} - ${G.skor[1]}</div><div>Indonesia vs ${G.vs||""}</div><div class="field"><i class="mid"></i><i class="circ"></i><i class="gl l"></i><i class="gl r"></i><span class="ball" id="ball" style="left:${G.ball}%"></span><b id="banner"></b></div><div id="log">${G.log.map(l=>`<p>${l}</p>`).join("")||"<p>Peluit dibunyikan.</p>"}</div></div>`:"";
 A.innerHTML=`
 ${hero()}${pssi()}${pers()}<div class="bar"><div class="stat"><b>#${rank()}</b><span>Rank FIFA</span></div><div class="stat"><b>${G.sesi}</b><span>Sesi turnamen ini</span></div><div class="stat"><b>${rating().toFixed(1)}</b><span>Rating tim</span></div><div class="stat"><b>${G.kon}</b><span>Sisa kontrak</span></div></div>
 ${pitch}
 ${tpanel()}${dash()}<div class="panel"><h2>Sesi latihan (tanpa batas)</h2><div class="btns">${pbtn}</div><p class="msg">${G.info}</p><p class="msg">Aturan: sesi latihan tidak dibatasi, selagi stamina pemain cukup. Pemain yang staminanya di bawah biaya sesi tidak ikut latihan. Lewati hari gratis tapi menurunkan ritme.</p></div>
 <div class="panel"><h2>Taktik lawan ${lw[0]} (kekuatan ${lw[1]})</h2><p class="msg" style="margin:0 0 8px">${lw[2]=="atk"?"Lawan suka menyerang: Serangan Balik atau Bertahan efektif.":lw[2]=="def"?"Lawan bertahan rapat: Menyerang atau Tekanan Tinggi efektif.":"Lawan bermain seimbang."}</p><div class="tac">${tbtn}</div><div class="tac" style="margin-top:6px">${fbtn}</div>${board()}<div class="segs">${seg}</div>
 <p class="msg" style="margin-bottom:10px">${TAK[G.tak].x} Formasi ${G.form}. Makin sering dipakai atau dilatih, makin familiar (bonus sampai 15%).</p>
 ${G.fin?`<button class="go" onclick="lanjut()">${nextName()}</button>`:`<button class="go" onclick="laga()" ${G.main?"disabled":""}>${G.main?"Laga berlangsung...":"Mulai pertandingan: "+lw[0]}</button>`}</div>
 ${sosmed()}${kabinet()}<div class="panel"><h2>Naturalisasi (dana ${G.dana})</h2><div class="btns">${nbtn}</div><p class="msg">Menang +20 dana, seri +8. Pemain baru menggantikan yang terlemah di posisi sama. Statistik hanya rekaan.</p>${scoutUI()}</div>
 <div class="panel"><h2>Skuad</h2>
 <div class="pl hd"><div>Pemain</div><span>Fisik</span><span>Teknik</span><span>Taktik</span><span>Mental</span><span>Stamina</span></div>${rows}</div>`;
 const lg=document.getElementById("log");if(lg)lg.scrollTop=lg.scrollHeight;
}
baru();
</script>
</body>
</html>
